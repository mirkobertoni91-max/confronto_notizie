name: Aggiorna Notizie

on:
  schedule:
    - cron: '0 */6 * * *'  # Ogni 6 ore
  workflow_dispatch:  # Permette l'esecuzione manuale

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Installa dipendenze
        run: pip install feedparser requests
      
      - name: Esegui aggregatore
        run: python aggregatore.py
      
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notizie.json
          git commit -m "Aggiornamento automatico notizie" || exit 0
          git push
